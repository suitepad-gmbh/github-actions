env:
  RUNS_ON_S3_BUCKET_CACHE: github-runner-cache-20240808144417347400000001
  AWS_REGION: eu-central-1

name: Build docker image and push to ECR

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
        description: The ECR repository name of the image to build.
      cache-mix:
        required: false
        type: boolean
        default: false
        description: Deprecated.
      registry:
        required: false
        type: string
        description: Deprecated. The registry is resolved from the ECR login.
      aws-region:
        required: true
        type: string
        default: eu-central-1
      ref:
        required: false
        type: string
        description: The git ref to check out and build. Defaults to the ref of the triggering event.
      require-image-build:
        required: false
        type: string
        default: "true"
        description: Set true to build the image even when the tag already exists on ECR.
      runner:
        required: false
        type: string
        default: '["self-hosted", "ubuntu-24.04", "2-cores"]'
        description: JSON list of runner labels to run the build on.

    outputs:
      image-tag:
        description: The short SHA the image was tagged with.
        value: ${{ jobs.docker_build_push.outputs.image-tag }}
      image-sha:
        description: The full SHA of the built commit.
        value: ${{ jobs.docker_build_push.outputs.image-sha }}
      build-skipped:
        description: "true when the image already existed on ECR and the build was skipped."
        value: ${{ jobs.docker_build_push.outputs.build-skipped }}

    secrets:
      aws-access-key-id:
        required: true
      aws-secret-access-key:
        required: true
      pat-github:
        required: true

jobs:
  docker_build_push:
    name: Build docker image and push to ECR
    runs-on: ${{ fromJSON(inputs.runner) }}
    env:
      COMPOSE_BAKE: true
    outputs:
      image-tag: ${{ steps.export-sha.outputs.sha_short }}
      image-sha: ${{ steps.export-sha.outputs.sha }}
      build-skipped: ${{ steps.check-if-built.outputs.build-skipped }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          token: ${{ secrets.pat-github }}
          submodules: "true"

      - name: Export short sha to outputs
        id: export-sha
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.aws-access-key-id }}
          aws-secret-access-key: ${{ secrets.aws-secret-access-key }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: "true"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Add metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.ecr-login.outputs.registry }}/${{ inputs.image }}
          tags: |
            ${{ steps.export-sha.outputs.sha_short }}

      - name: Check if image already built
        id: check-if-built
        run: |
          if [ '${{ inputs.require-image-build }}' == 'true' ]; then
            echo "build-skipped=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          image=$(aws ecr list-images --repository-name ${{ inputs.image }} --query "imageIds[?imageTag=='${{ steps.export-sha.outputs.sha_short }}'] | [0].imageTag" || echo null)
          if [[ $image == null ]]; then
            echo "build-skipped=false" >> $GITHUB_OUTPUT
          else
            echo "::warning title=Skipping docker build::Image already exists on AWS ECR. Skipping image build."
            echo "build-skipped=true" >> $GITHUB_OUTPUT
          fi

      - name: Build and push image
        if: ${{ steps.check-if-built.outputs.build-skipped == 'false' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-to: mode=max,type=registry,ref=${{ steps.ecr-login.outputs.registry }}/${{ inputs.image }}:cache,oci-mediatypes=true,compression=zstd
          cache-from: type=registry,ref=${{ steps.ecr-login.outputs.registry }}/${{ inputs.image }}:cache
          build-args: |
            COMMIT_ID=${{ steps.export-sha.outputs.sha_short }}
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
