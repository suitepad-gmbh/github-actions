env:
  RUNS_ON_S3_BUCKET_CACHE: github-runner-cache-20240808144417347400000001
  AWS_REGION: eu-central-1

name: Deploy task definition to AWS ECS

on:
  workflow_call:
    inputs:
      aws-region:
        type: string
        required: false
        default: eu-central-1
      image-uri:
        type: string
        required: true
        description: The URI of the container image to insert into the ECS task definition
      image-tag:
        type: string
        required: false
        description: The container image tag to insert into the ECS task definition
      container-name:
        type: string
        required: false
        description: The name of the container defined in the containerDefinitions section of the ECS task definition
        default: app
      service-name:
        type: string
        required: false
        description: The name of the ECS service to deploy to.
      services:
        type: string
        required: false
        description: 'JSON list of services to be deployed. Example: { "include": [{"SERVICE": "rattle"}, {"SERVICE": "rattle-sidekiq"}] }'
        default: '{ "include": [] }'
      cluster:
        type: string
        required: true
        description: The name of the ECS service's cluster.
      environment:
        type: string
        required: true
        default: staging
        description: The stack environment of the ECS service.
      preview-task-definition:
        type: string
        required: false
        default: "false"
      skip-init-task:
        type: string
        required: false
        default: "true"
        description: Set true to skip init task.
      require-image-build:
        type: string
        required: false
        default: "false"
        description: Set true to build docker image.
      architectures:
        type: string
        required: false
        default: '["amd64", "arm64"]'
        description: JSON list of architectures to build the image for. Supported values are amd64 and arm64.
      init-task-command:
        type: string
        required: false
        description: 'Init task command as a JSON list. Example: ["rails", "db:migrate"]'
        default: "[]"

    secrets:
      pat-github:
        required: true
      aws-access-key-id:
        required: true
      aws-secret-access-key:
        required: true
      staging-aws-deploy-role:
        required: true
      production-aws-deploy-role:
        required: true

      staging-ecs-template-bucket:
        required: true
        description: The S3 URI of the staging ECS template generated by Terraform.
      production-ecs-template-bucket:
        required: true
        description: The S3 URI of the production ECS template generated by Terraform.

      staging-slack-webhook:
        required: true
      production-slack-webhook:
        required: true

jobs:
  docker-build-push:
    name: Build docker image and push to ECR
    uses: suitepad-gmbh/github-actions/.github/workflows/docker-build-push.yml@main
    with:
      image: ${{ inputs.service-name }}
      aws-region: ${{ inputs.aws-region }}
      ref: ${{ inputs.image-tag || github.sha }}
      require-image-build: ${{ inputs.require-image-build }}
      architectures: ${{ inputs.architectures }}
    secrets:
      aws-access-key-id: ${{ secrets.aws-access-key-id }}
      aws-secret-access-key: ${{ secrets.aws-secret-access-key }}
      pat-github: ${{ secrets.pat-github }}

  create-deployment:
    name: "Create Deployment env: ${{ inputs.environment }}"
    runs-on: [self-hosted, ubuntu-24.04-arm, 2-cores]
    needs: [docker-build-push]
    permissions:
      contents: read
      deployments: write
    outputs:
      deployment_id: ${{ steps.create-deployment.outputs.deployment_id }}
      target_url: ${{ steps.export-status-url.outputs.url }}
    steps:
      - name: Export service status URL
        id: export-status-url
        env:
          DOMAIN: ${{ inputs.environment == 'prod' && 'suitepad.systems' || 'suitepad.engineering' }}
        run: |
          echo "url=https://${{ inputs.service-name }}.${{ inputs.environment }}.${{ env.DOMAIN }}/status" >> $GITHUB_OUTPUT

      - uses: chrnorm/deployment-action@v2
        name: Create deployment
        id: create-deployment
        with:
          ref: ${{ needs.docker-build-push.outputs.image-tag }}
          token: ${{ github.token }}
          environment: ${{ inputs.environment }}
          environment-url: ${{ steps.export-status-url.outputs.url }}
          description: "[${{ inputs.service-name }}-${{ inputs.environment }}]"
          initial-status: in_progress

  deploy-task-definition:
    name: Deploy main service and run init task
    runs-on: [self-hosted, ubuntu-24.04-arm, 2-cores]
    needs: [create-deployment, docker-build-push]
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.environment == 'prod' && secrets.production-aws-deploy-role || secrets.staging-aws-deploy-role }}
          role-skip-session-tagging: true
          role-duration-seconds: 3600
          aws-access-key-id: ${{ secrets.aws-access-key-id }}
          aws-secret-access-key: ${{ secrets.aws-secret-access-key }}
          aws-region: ${{ inputs.aws-region }}

      - name: Fetch Task Definition and Network configs
        id: fetch-task-definition
        env:
          TASK_DEFINITION_FILE: ${{ inputs.environment == 'prod' && secrets.production-ecs-template-bucket || secrets.staging-ecs-template-bucket }}
        run: |
          aws s3 cp ${{ env.TASK_DEFINITION_FILE }}/${{ inputs.cluster }}-${{ inputs.service-name }}-${{ inputs.environment }} /tmp/task-definition-template.json
          aws s3 cp ${{ env.TASK_DEFINITION_FILE }}/${{ inputs.cluster }}-${{ inputs.service-name }}-${{ inputs.environment }}-network-config /tmp/network-config.json
          NETWORK_CONFIG=$(cat /tmp/network-config.json)
          echo "network_config=${NETWORK_CONFIG//'%'/'%25'}" >> $GITHUB_OUTPUT
          echo "security_groups=$(cat /tmp/network-config.json | jq -r '.awsvpcConfiguration.securityGroups | join(",")')" >> $GITHUB_OUTPUT
          echo "subnets=$(cat /tmp/network-config.json | jq -r '.awsvpcConfiguration.subnets | join(",")')" >> $GITHUB_OUTPUT

      - name: Render app task definition
        id: render-app-container
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: /tmp/task-definition-template.json
          container-name: ${{ inputs.container-name }}
          image: ${{ inputs.image-uri }}:${{ needs.docker-build-push.outputs.image-tag }}

      - name: Preview ECS task definition
        if: ${{ inputs.preview-task-definition == 'true' }}
        run: |
          cat ${{ steps.render-app-container.outputs.task-definition }}

      - name: Deploy to Amazon ECS service
        id: deploy-service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-app-container.outputs.task-definition }}
          service: ${{ inputs.service-name }}-${{ inputs.environment }}
          cluster: ${{ inputs.cluster }}
          wait-for-service-stability: true
          wait-for-minutes: 10
          wait-max-delay-seconds: 30
          force-new-deployment: true
          propagate-tags: "TASK_DEFINITION"

          run-task: ${{ inputs.skip-init-task != 'true' }}
          run-task-container-overrides: '[{"name": "app", "command": ${{ inputs.init-task-command }} }]'
          run-task-security-groups: ${{ steps.fetch-task-definition.outputs.security_groups }}
          run-task-subnets: ${{ steps.fetch-task-definition.outputs.subnets }}
          run-task-started-by: GHA-${{ github.actor }}
          wait-for-task-stopped: true

      - name: Report failed init task
        if: ${{ failure() && steps.deploy-service.outcome == 'failure' && steps.deploy-service.outputs.run-task-arn != '' }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          TASK_ARNS: ${{ steps.deploy-service.outputs.run-task-arn }}
          TASK_DEFINITION: ${{ steps.render-app-container.outputs.task-definition }}
          CLUSTER: ${{ inputs.cluster }}
          CONTAINER: ${{ inputs.container-name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import uuid

          def aws(*args):
              result = subprocess.run(
                  ["aws", *args, "--output", "json", "--no-cli-pager"],
                  capture_output=True, text=True, timeout=30,
              )
              if result.returncode:
                  # Do not echo CLI stderr, which may contain request values.
                  raise RuntimeError("AWS diagnostics unavailable; check log permissions or stream availability")
              return json.loads(result.stdout)

          with open(os.environ["TASK_DEFINITION"]) as source:
              definition = json.load(source)
          container = next(c for c in definition["containerDefinitions"] if c["name"] == os.environ["CONTAINER"])
          sensitive = re.compile(r"password|passwd|secret|token|authorization|api.?key|access.?key|credential", re.I)
          values = dict(os.environ)
          values.update({v["name"]: v["value"] for v in container.get("environment", [])})
          secrets = {
              variant for k, v in values.items() if v and sensitive.search(k)
              for variant in (v, json.dumps(v)[1:-1], json.dumps(v, ensure_ascii=False)[1:-1])
          }

          def redact(text):
              for value in sorted(secrets, key=len, reverse=True):
                  text = text.replace(value, "[REDACTED]")
              # Scan markers once, retaining the first opener until the next closer.
              parts, start, cursor = [], None, 0
              for marker in re.finditer(r"-----(BEGIN|END) [^-]*PRIVATE KEY-----", text):
                  if marker[1] == "BEGIN" and start is None:
                      start = marker.start()
                  elif marker[1] == "END" and start is not None:
                      parts.extend((text[cursor:start], "[REDACTED]"))
                      cursor, start = marker.end(), None
              text = "".join([*parts, text[cursor:]])
              # Start at word boundaries and mask the entire userinfo, including token-only URLs.
              text = re.sub(r"(\b\w+://)[^\s/@]+@", r"\1[REDACTED]@", text)
              text = re.sub(r"\b(?:Bearer|Basic)\s+[A-Za-z0-9._~+/=-]+", "[REDACTED]", text, flags=re.I)
              text = re.sub(r"\b(?:AKIA|ASIA)[A-Z0-9]{16}\b", "[REDACTED]", text)
              # Match each key word once; do not retry its credential substrings if no separator follows.
              key = r"(?i)(?<![\w-])((?>[\w-]*(?:password|passwd|secret|token|authorization|api.?key|access.?key|credential)[\w-]*)[\"']?\s*[:=]\s*)"
              quoted = r"\"(?:\\.|[^\"\\])*\"|'(?:\\.|[^'\\])*'"
              text = re.sub(r"(?i)(\bauthorization[\"']?[ \t]*[:=][ \t]*)" + rf"(?:{quoted}|[^\r\n]+)", r"\1[REDACTED]", text)
              text = re.sub(key + rf"(?:{quoted}|[^\s,;]+)", r"\1[REDACTED]", text)
              return re.sub(r"[\x00-\x08\x0b-\x1f\x7f]", "", text)

          tasks = aws("ecs", "describe-tasks", "--cluster", os.environ["CLUSTER"], "--tasks", *json.loads(os.environ["TASK_ARNS"]))
          for task in tasks.get("tasks", []):
              if task.get("lastStatus") != "STOPPED" or all(c.get("exitCode") == 0 for c in task.get("containers", [])):
                  continue
              details = {
                  "task": task["taskArn"], "stopCode": task.get("stopCode"), "reason": task.get("stoppedReason"),
                  "containers": [{k: c.get(k) for k in ("name", "exitCode", "reason")} for c in task.get("containers", [])],
              }
              # Log content is data, never a GitHub workflow command.
              marker = uuid.uuid4().hex
              print(f"::stop-commands::{marker}", flush=True)
              try:
                  print(redact(json.dumps(details)))
                  config = container.get("logConfiguration", {})
                  if config.get("logDriver") != "awslogs":
                      print("Application logs unavailable: task does not use awslogs")
                      continue
                  options = config["options"]
                  stream = f"{options['awslogs-stream-prefix']}/{container['name']}/{task['taskArn'].rsplit('/', 1)[-1]}"
                  logs = aws("logs", "get-log-events", "--region", options["awslogs-region"],
                             "--log-group-name", options["awslogs-group"], "--log-stream-name", stream,
                             "--limit", "100", "--no-start-from-head", "--no-paginate")
                  excerpt = redact("\n".join(event["message"] for event in logs.get("events", [])))
                  print("Application log excerpt (last page, at most 100 events / 12000 characters):")
                  print(excerpt[-12000:] if excerpt else "No application log events available yet")
              except (RuntimeError, subprocess.TimeoutExpired) as error:
                  print("Application logs unavailable: " + type(error).__name__)
              finally:
                  print(f"::{marker}::", flush=True)
          PY

  deploy-sidecars:
    name: Deploy supporting services
    runs-on: [self-hosted, ubuntu-24.04-arm, 2-cores]
    needs: [docker-build-push, deploy-task-definition]

    if: ${{ fromJson(inputs.services).include[0] }}
    concurrency: deploy-sidecar-${{ matrix.SERVICE }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.services) }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.environment == 'prod' && secrets.production-aws-deploy-role || secrets.staging-aws-deploy-role }}
          role-skip-session-tagging: true
          role-duration-seconds: 3600
          aws-access-key-id: ${{ secrets.aws-access-key-id }}
          aws-secret-access-key: ${{ secrets.aws-secret-access-key }}
          aws-region: ${{ inputs.aws-region }}

      - name: Fetch Task Definition template from S3
        env:
          TASK_DEFINITION_FILE: ${{ inputs.environment == 'prod' && secrets.production-ecs-template-bucket || secrets.staging-ecs-template-bucket }}
        run: |
          aws s3 cp ${{ env.TASK_DEFINITION_FILE }}/${{ inputs.cluster }}-${{ matrix.SERVICE }}-${{ inputs.environment }} /tmp/task-definition-template.json

      - name: Render app task definition
        id: render-app-container
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: /tmp/task-definition-template.json
          container-name: ${{ inputs.container-name }}
          image: ${{ inputs.image-uri }}:${{ needs.docker-build-push.outputs.image-tag }}

      - name: Preview ECS task definition
        if: ${{ inputs.preview-task-definition == 'true' }}
        run: |
          cat ${{ steps.render-app-container.outputs.task-definition }}

      - name: Deploy to Amazon ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-app-container.outputs.task-definition }}
          service: ${{ matrix.SERVICE }}-${{ inputs.environment }}
          cluster: ${{ inputs.cluster }}
          wait-for-service-stability: true
          wait-for-minutes: 10
          wait-max-delay-seconds: 30
          force-new-deployment: true
          propagate-tags: "TASK_DEFINITION"

  update-deployment-status:
    runs-on: [self-hosted, ubuntu-24.04-arm, 2-cores]
    name: Update deployment status
    if: ${{ always() && needs.create-deployment.result == 'success' }}
    needs: [create-deployment, deploy-task-definition, deploy-sidecars]
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Update deployment status
        uses: chrnorm/deployment-status@v2
        env:
          SUCCESS: ${{ needs.deploy-task-definition.result == 'success' && (needs.deploy-sidecars.result == 'skipped' || needs.deploy-sidecars.result == 'success') }}
        with:
          token: "${{ github.token }}"
          state: ${{ env.SUCCESS == 'true' && 'success' || 'failure' }}
          deployment-id: ${{ needs.create-deployment.outputs.deployment_id }}

  notify-slack:
    name: Notify deploy status on Slack
    runs-on: [self-hosted, ubuntu-24.04-arm, 2-cores]
    if: ${{ always() }}
    needs: [create-deployment, deploy-task-definition, deploy-sidecars]
    env:
      SUCCESS: ${{ needs.deploy-task-definition.result == 'success' && (needs.deploy-sidecars.result == 'skipped' || needs.deploy-sidecars.result == 'success') }}
      SLACK_WEBHOOK_URL: ${{ inputs.environment == 'prod' && secrets.production-slack-webhook || secrets.staging-slack-webhook }}
    steps:
      - name: Notify Slack on success
        if: ${{ env.SUCCESS == 'true' }}
        run: |
          curl -sf -X POST -H 'Content-type: application/json' \
            --data @- "$SLACK_WEBHOOK_URL" <<EOF
          {
            "text": "[${{ inputs.environment }}] ${{ github.workflow }} succeeded",
            "attachments": [
              {
                "color": "#2EB886",
                "mrkdwn_in": ["text"],
                "text": ":white_check_mark: *[${{ inputs.environment }}] ${{ github.workflow }}* succeeded in <${{ github.server_url }}/${{ github.repository }}|${{ github.repository }}>",
                "footer": "Linked Repo <${{ github.server_url }}/${{ github.repository }}|${{ github.repository }}> | <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow Run> | <${{ needs.create-deployment.outputs.target_url }}|Check Service Status>"
              }
            ]
          }
          EOF

      - name: Notify Slack on failure
        if: ${{ env.SUCCESS != 'true' }}
        run: |
          curl -sf -X POST -H 'Content-type: application/json' \
            --data @- "$SLACK_WEBHOOK_URL" <<EOF
          {
            "text": "[${{ inputs.environment }}] ${{ github.workflow }} failed",
            "attachments": [
              {
                "color": "#D40E0D",
                "mrkdwn_in": ["text"],
                "text": ":x: *[${{ inputs.environment }}] ${{ github.workflow }}* failed in <${{ github.server_url }}/${{ github.repository }}|${{ github.repository }}>\n<!subteam^S022DRPB353>",
                "footer": "Linked Repo <${{ github.server_url }}/${{ github.repository }}|${{ github.repository }}> | <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow Run> | <${{ needs.create-deployment.outputs.target_url }}|Check Service Status>"
              }
            ]
          }
          EOF
